name: Backend tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=critical
      - run: npm run build:editor
      - run: git diff --exit-code -- ../dist/assets/js/BlogManager-CgU_iRbw.js ../dist/assets/js/index-BLfo3RSv.js
      - run: node --experimental-vm-modules ../tools/check-bundle-syntax.cjs
      - run: node --check ../dist/contact-inbox.js
      - run: node --check ../dist/findtheweb-release.js
      - run: npm run check:syntax
      - run: npm test -- --runInBand
