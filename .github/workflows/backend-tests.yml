name: Backend tests

on:
  push:
    branches: [main, master, 'frontend/**']
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=low
      - run: npm ci --prefix ../frontend-recovered
      - run: npm audit --prefix ../frontend-recovered --audit-level=low
      - run: npm run build --prefix ../frontend-recovered
      - run: git diff --exit-code -- ../dist/index.html ../dist/assets/frontend ../dist/frontend-build.json ../dist/release-manifest.json ../dist/seo.php ../dist/seo-render.css
      - run: npm run build:editor
      - run: git diff --exit-code -- ../dist/assets/js/BlogManager-CgU_iRbw.js ../dist/assets/js/index-BLfo3RSv.js
      - run: node --experimental-vm-modules ../tools/check-bundle-syntax.cjs
      - run: node --check ../dist/contact-inbox.js
      - run: node --check ../dist/findtheweb-release.js
      - run: npm run check:syntax
      - run: npm test -- --runInBand
  frontend-browser:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix backend
      - run: npm ci --prefix frontend-recovered
      - run: npx --prefix frontend-recovered playwright install --with-deps chromium
      - run: |
          node backend/scripts/editor-browser-qa.cjs > /tmp/findtheweb-qa.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5097/health > /dev/null 2>&1; then exit 0; fi
            sleep 0.5
          done
          echo 'Isolated QA service did not become ready'
          exit 1
      - run: node frontend-recovered/scripts/browser-qa.cjs
      - run: docker build -t findtheweb-seo-qa -f tools/seo-qa.Dockerfile tools
      - run: node frontend-recovered/scripts/seo-browser-qa.cjs
      - run: cp /tmp/findtheweb-qa.log docs/qa/frontend-20261027/server.log
        if: failure()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-browser-qa
          path: docs/qa/
          retention-days: 7
